name: preview_on_pr_update

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install Python dependencies
        run: |
          pip install pipenv
          cd src/apps/backend
          pipenv install --dev --skip-lock || pipenv install --dev

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python linting
        run: make run-lint
        working-directory: src/apps/backend

      - name: Run TypeScript linting
        run: npm run lint:ts

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB to be ready..."
          python3 -c "
          import socket
          import time
          for i in range(30):
              try:
                  sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  sock.settimeout(1)
                  result = sock.connect_ex(('localhost', 27017))
                  sock.close()
                  if result == 0:
                      print('MongoDB is ready!')
                      exit(0)
              except:
                  pass
              print(f'Attempt {i+1}: Waiting for MongoDB...')
              time.sleep(2)
          print('MongoDB connection timeout - continuing anyway')
          "

      - name: Run Python tests
        env:
          MONGO_URL: mongodb://localhost:27017/test_db
          APP_ENV: testing
          PYTHONPATH: src/apps/backend
        run: |
          cd src/apps/backend
          pipenv run pytest --disable-warnings -v ../../tests/modules/comment/ ../../tests/modules/task/

      - name: Build frontend
        run: npm run build:frontend

      - name: Check build output
        run: |
          if [ ! -f "dist/public/index.bundle.js" ]; then
            echo "Build failed - index.bundle.js not found"
            exit 1
          fi
          echo "Build successful"

